name: Deploy Extension Common

on:
  workflow_call:
    inputs:
      extension_id:
        required: true
        type: string

      loader_file:
        required: true
        type: string

      visibility:
        required: false
        type: string
        default: ''

      distribution:
        required: false
        type: string
        default: ''

      release_note_url:
        required: true
        type: string

      category:
        required: false
        type: string
        default: Etc

      native_so_only:
        required: false
        type: boolean
        default: false

      native_build_script:
        required: false
        type: string
        default: ''

    secrets:
      DEPLOY_TOKEN:
        required: true

permissions:
  contents: write

concurrency:
  group: ulol-extension-repository-deploy
  cancel-in-progress: false

env:
  RAW_BASE_URL: https://raw.githubusercontent.com/UlolSkpProject/ULOL-Extension-Repository/refs/heads/main

jobs:
  build-native:
    if: ${{ inputs.native_build_script != '' }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        ruby_abi: ['3.2', '3.4']

    steps:
      - name: Checkout Extension Repo
        uses: actions/checkout@v5

      - name: Build and Test Native Extension
        shell: pwsh
        env:
          NATIVE_BUILD_SCRIPT: ${{ inputs.native_build_script }}
          RUBY_ABI: ${{ matrix.ruby_abi }}
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_BUILD_SCRIPT
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw "Native build script not found: $scriptPath"
          }

          & $scriptPath `
            -RubyAbi $env:RUBY_ABI `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'native-stage')

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-ruby-${{ matrix.ruby_abi }}
          path: ${{ runner.temp }}/native-stage
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [build-native]
    if: ${{ always() && (needs.build-native.result == 'success' || needs.build-native.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Extension Repo
        uses: actions/checkout@v5

      - name: Checkout Deploy Repo
        uses: actions/checkout@v5
        with:
          repository: UlolSkpProject/ULOL-Extension-Repository
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy_repo

      - name: Download Ruby 3.2 Native Artifact
        if: ${{ inputs.native_build_script != '' }}
        uses: actions/download-artifact@v4
        with:
          name: native-ruby-3.2
          path: native_artifacts/ruby3.2

      - name: Download Ruby 3.4 Native Artifact
        if: ${{ inputs.native_build_script != '' }}
        uses: actions/download-artifact@v4
        with:
          name: native-ruby-3.4
          path: native_artifacts/ruby3.4

      - name: Validate Native Deployment Mode
        if: ${{ inputs.native_so_only && inputs.native_build_script == '' }}
        shell: bash
        run: |
          echo "ERROR: native_so_only is deprecated. Provide native_build_script for ABI-specific builds." >&2
          exit 1

      - name: Resolve Deploy Options
        shell: bash
        run: |
          VISIBILITY="${{ inputs.visibility }}"
          DISTRIBUTION="${{ inputs.distribution }}"

          if [ -z "$VISIBILITY" ] || [ -z "$DISTRIBUTION" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"

            VISIBILITY="visible"
            DISTRIBUTION="active"

            if [[ "$TAG_NAME" == *"-hidden-"* ]] || [[ "$TAG_NAME" == *"-hidden" ]]; then
              VISIBILITY="hidden"
            fi

            if [[ "$TAG_NAME" == *"-preview"* ]]; then
              DISTRIBUTION="preview"
            elif [[ "$TAG_NAME" == *"-deprecated"* ]]; then
              DISTRIBUTION="deprecated"
            elif [[ "$TAG_NAME" == *"-disabled"* ]]; then
              DISTRIBUTION="disabled"
            elif [[ "$TAG_NAME" == *"-active"* ]]; then
              DISTRIBUTION="active"
            fi
          fi

          echo "INPUT_VISIBILITY=$VISIBILITY" >> "$GITHUB_ENV"
          echo "INPUT_DISTRIBUTION=$DISTRIBUTION" >> "$GITHUB_ENV"

          echo "Resolved visibility: $VISIBILITY"
          echo "Resolved distribution: $DISTRIBUTION"

      - name: Extract Metadata
        id: metadata
        shell: bash
        run: |
          python3 deploy_repo/scripts/extract_metadata.py
        env:
          LOADER_FILE: ${{ inputs.loader_file }}

      - name: Export Metadata
        shell: bash
        run: |
          {
            echo "EXTENSION_ID=${{ inputs.extension_id }}"
            echo "LOADER_FILE=${{ inputs.loader_file }}"
            echo "EXTENSION_NAME=${{ steps.metadata.outputs.name }}"
            echo "EXTENSION_VERSION=${{ steps.metadata.outputs.version }}"
            echo "EXTENSION_CREATOR=${{ steps.metadata.outputs.creator }}"
            echo "EXTENSION_DESCRIPTION=${{ steps.metadata.outputs.description }}"
            echo "EXTENSION_CATEGORY=${{ inputs.category }}"
          } >> "$GITHUB_ENV"

      - name: Build Standard RBZ
        if: ${{ inputs.native_build_script == '' }}
        id: rbz_standard
        shell: bash
        run: |
          bash deploy_repo/scripts/build_rbz.sh
        env:
          NATIVE_SO_ONLY: ${{ inputs.native_so_only }}

      - name: Build Ruby 3.2 RBZ
        if: ${{ inputs.native_build_script != '' }}
        id: rbz32
        shell: bash
        env:
          RUBY_ABI: '3.2'
          NATIVE_ARTIFACT_DIR: native_artifacts/ruby3.2
        run: |
          bash deploy_repo/scripts/build_rbz.sh

      - name: Build Ruby 3.4 RBZ
        if: ${{ inputs.native_build_script != '' }}
        id: rbz34
        shell: bash
        env:
          RUBY_ABI: '3.4'
          NATIVE_ARTIFACT_DIR: native_artifacts/ruby3.4
        run: |
          bash deploy_repo/scripts/build_rbz.sh

      - name: Copy RBZ
        shell: bash
        run: |
          mkdir -p "deploy_repo/rbz/${EXTENSION_ID}"
          if [ -n "${{ inputs.native_build_script }}" ]; then
            cp "${{ steps.rbz32.outputs.rbz_name }}" "deploy_repo/rbz/${EXTENSION_ID}/"
            cp "${{ steps.rbz34.outputs.rbz_name }}" "deploy_repo/rbz/${EXTENSION_ID}/"
          else
            cp "${{ steps.rbz_standard.outputs.rbz_name }}" "deploy_repo/rbz/${EXTENSION_ID}/"
          fi

      - name: Record RBZ Updated Time
        shell: bash
        run: |
          echo "RBZ_UPDATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Update Standard Manifest Entry
        if: ${{ inputs.native_build_script == '' }}
        shell: bash
        run: |
          python3 deploy_repo/scripts/update_manifest.py
        env:
          INPUT_VISIBILITY: ${{ env.INPUT_VISIBILITY }}
          INPUT_DISTRIBUTION: ${{ env.INPUT_DISTRIBUTION }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_RELEASE_NOTE_URL: ${{ inputs.release_note_url }}
          MANIFEST_PATH: deploy_repo/manifest.json
          RAW_BASE_URL: ${{ env.RAW_BASE_URL }}

      - name: Update Ruby 3.2 Manifest Artifact
        if: ${{ inputs.native_build_script != '' }}
        shell: bash
        run: |
          python3 deploy_repo/scripts/update_manifest.py
        env:
          INPUT_VISIBILITY: ${{ env.INPUT_VISIBILITY }}
          INPUT_DISTRIBUTION: ${{ env.INPUT_DISTRIBUTION }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_RELEASE_NOTE_URL: ${{ inputs.release_note_url }}
          MANIFEST_PATH: deploy_repo/manifest.json
          RAW_BASE_URL: ${{ env.RAW_BASE_URL }}
          RBZ_NAME: ${{ steps.rbz32.outputs.rbz_name }}
          RBZ_SHA256: ${{ steps.rbz32.outputs.rbz_sha256 }}
          RUBY_ABI: '3.2'
          PLATFORM: win64

      - name: Update Ruby 3.4 Manifest Artifact
        if: ${{ inputs.native_build_script != '' }}
        shell: bash
        run: |
          python3 deploy_repo/scripts/update_manifest.py
        env:
          INPUT_VISIBILITY: ${{ env.INPUT_VISIBILITY }}
          INPUT_DISTRIBUTION: ${{ env.INPUT_DISTRIBUTION }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_RELEASE_NOTE_URL: ${{ inputs.release_note_url }}
          MANIFEST_PATH: deploy_repo/manifest.json
          RAW_BASE_URL: ${{ env.RAW_BASE_URL }}
          RBZ_NAME: ${{ steps.rbz34.outputs.rbz_name }}
          RBZ_SHA256: ${{ steps.rbz34.outputs.rbz_sha256 }}
          RUBY_ABI: '3.4'
          PLATFORM: win64

      - name: Commit Manifest and RBZ
        shell: bash
        run: |
          cd deploy_repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main

          git add manifest.json rbz

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Deploy ${EXTENSION_ID} ${EXTENSION_VERSION}"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi

            echo "Push failed. Retrying in $((i * 3)) seconds..."
            sleep $((i * 3))
          done

          echo "Failed to push after retries"
          exit 1
