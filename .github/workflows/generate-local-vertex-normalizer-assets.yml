name: Generate LocalVertexNormalizer documentation assets

on:
  push:
    branches:
      - docs/local-vertex-normalizer-assets
    paths:
      - .github/workflows/generate-local-vertex-normalizer-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: docs/local-vertex-normalizer-assets
          fetch-depth: 0

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pillow

      - name: Generate PNG diagrams
        run: python tools/generate_local_vertex_normalizer_assets.py

      - name: Keep generated assets only
        run: |
          rm -f tools/generate_local_vertex_normalizer_assets.py
          rm -f .github/workflows/generate-local-vertex-normalizer-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: LocalVertexNormalizer 설명용 PNG 추가"
          git push origin HEAD:docs/local-vertex-normalizer-assets
